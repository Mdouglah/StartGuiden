<script>
  /* Nattläge: Välkomstguiden följer enhetens inställning tills man själv väljer med månknappen.

  (function(){var t,m=document.cookie.match(/(?:^|; )norvay-tema=(light|dark)/);if(m)t=m[1];if(!t){try{t=localStorage.getItem('norvay-tema')}catch(e){}}if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)})();

<style>
/* Lokala typsnitt (inga externa anrop). Lexend: SIL Open Font License 1.1, från @fontsource/lexend 5.3.0 */
@font-face{font-family:'Lexend';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/lexend-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Lexend';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/lexend-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Lexend';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/lexend-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/dm-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/dm-sans-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/dm-sans-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/newsreader-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-style:italic;font-weight:400;font-display:swap;src:url('/fonts/newsreader-latin-400-italic.woff2') format('woff2')}
:root{
  /* Ljust läge: Norvay-temat (skola). Mörkt läge nedan: samma grundfärger som Norvays mörka läge. */
  --bg:#f5f3ec; --bg-grad:none; --surface:#FFFFFF; --ink:#123f37; --muted:#4f6b63; --line:rgba(18,63,55,.14);
  --accent:#2f6b5a; --accent-ink:#FFFFFF; --btn:#2f6b5a; --ok:#1C7F45; --warn:#B8322A;
  --plate:#d7e2d7; --plate-dot:#c3d3c4; --chip:#FFFFFF; --chip-line:#b9cbb9; --soft:#e6ede5;
  --logo:#2f6b5a; --logo-kant:#24564a; --notis-kant:#F5C211; --kort-skugga:none; /* appens egna färger */
  --band:#d7e2d7; --rubrik-em:#a4533c; --form-ljus:#f5f3ec; --form-prick:#dd9479; /* sidhuvudets band och form */
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f2a24; --bg-grad:none; --surface:#163731; --ink:#ece7da; --muted:#a9bdb5; --line:rgba(236,231,218,.14);
    --accent:#8fc2a8; --accent-ink:#0f2a24; --btn:#8fc2a8; --ok:#7fcf9c; --warn:#f0a99a;
    --plate:#1f4239; --plate-dot:#2a5045; --chip:#1c3d35; --chip-line:#33584e; --soft:#1c3d35; --band:#1f4239; --rubrik-em:#e3a58f; --form-ljus:#0f2a24; --form-prick:#dd9479; --logo:#2f6b5a; --logo-kant:#24564a; --kort-skugga:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f2a24; --bg-grad:none; --surface:#163731; --ink:#ece7da; --muted:#a9bdb5; --line:rgba(236,231,218,.14);
  --accent:#8fc2a8; --accent-ink:#0f2a24; --btn:#8fc2a8; --ok:#7fcf9c; --warn:#f0a99a;
  --plate:#1f4239; --plate-dot:#2a5045; --chip:#1c3d35; --chip-line:#33584e; --soft:#1c3d35; --band:#1f4239; --rubrik-em:#e3a58f; --form-ljus:#0f2a24; --form-prick:#dd9479; --logo:#2f6b5a; --logo-kant:#24564a; --kort-skugga:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 56px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--serif)}
h2{margin:0 0 6px;font-size:clamp(24px,4vw,30px);line-height:1.2}
.lead{margin:0 0 18px;color:var(--muted);max-width:62ch}

/* Sidhuvud: Norvay-layouten "band" med formen "arc" */
.top{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:16px;background:var(--band);border-radius:32px;padding:28px 32px}
.top-text{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.n-motif{position:relative;width:120px;aspect-ratio:1}
.n-motif::before,.n-motif::after{content:"";position:absolute}
.n-motif--arc::before{inset:20% 15% 0 15%;background:var(--form-ljus);border-radius:999px 999px 0 0}
.n-motif--arc::after{width:26%;aspect-ratio:1;border-radius:50%;background:var(--form-prick);top:10%;right:10%}
@media (max-width:560px){.top{grid-template-columns:1fr;padding:22px 20px;border-radius:24px}.n-motif{width:80px;order:-1}}
h1,h2,h3{font-weight:400;letter-spacing:-.01em}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand h1{margin:0;font-size:clamp(32px,6vw,50px);line-height:1;font-weight:400;color:var(--ink)}
.brand h1 em{font-style:italic;color:var(--rubrik-em)}
.brand p{margin:4px 0 0;color:var(--ink);font-size:15px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:700;font-family:var(--serif)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--accent-ink)}
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:0 0 18px;color:var(--muted);font-size:15px}
.tools label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.notice{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--notis-kant);border-radius:10px;padding:12px 14px;margin:0 0 18px;font-size:15px}

.back{border:0;background:none;color:var(--accent);font-weight:500;cursor:pointer;padding:6px 0;margin-bottom:8px}

/* Theme grid */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.theme{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;cursor:pointer;position:relative;overflow:hidden;min-height:150px}
.theme::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--tc)}
.theme:hover{border-color:var(--tc)}
.theme .ic{font-size:40px;line-height:1;margin-top:6px}
.theme .nm{font-weight:700;font-size:19px;line-height:1.25}
.theme .meta{color:var(--muted);font-size:14px;margin-top:auto}

.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.head .ic{font-size:44px;line-height:1}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:500}
.tabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--btn);color:var(--accent-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.wcard{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;background:var(--soft);border:2px solid transparent;border-radius:14px;padding:18px 8px 12px;cursor:pointer;min-height:150px}
.wcard:hover{border-color:var(--accent)}
.wcard.on{border-color:var(--accent);background:var(--surface)}
.emo{font-size:58px;line-height:1.1}
.wcard .word{font-weight:700;font-size:20px;text-align:center}
.wcard .ex{font-size:14px;color:var(--muted);text-align:center;min-height:1.4em}
.hint{margin-top:14px;color:var(--muted);font-size:15px}

/* Quiz */
.qtop{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.say{font-size:clamp(22px,4vw,32px);font-weight:700}
.prog{margin-left:auto;font-weight:500;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:560px}
@media (min-width:640px){.opts{grid-template-columns:repeat(4,1fr);max-width:none}}
.opt{background:var(--soft);border:3px solid transparent;border-radius:16px;min-height:130px;display:grid;place-items:center;cursor:pointer;padding:10px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);animation:pop .45s ease}
.opt.wrong{border-color:var(--warn);animation:shake .35s ease}
.opt .emo{font-size:64px}
.btn{border:0;background:var(--btn);color:var(--accent-ink);border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.status{min-height:1.6em;margin-top:14px;font-weight:500}
.status.ok{color:var(--ok)} .status.no{color:var(--warn)}
.done{text-align:center;padding:24px 10px}
.done .big{font-size:56px;line-height:1}
.done p{font-size:22px;font-weight:700;margin:10px 0 16px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* Sentence */
.slots{min-height:62px;border:2px dashed var(--chip-line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.slots.ok{border-style:solid;border-color:var(--ok)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--chip-line);background:var(--chip);border-radius:10px;padding:8px 14px;font-size:20px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}

/* Lego */
.plate{background-color:var(--plate);background-image:radial-gradient(circle,var(--plate-dot) 5px,transparent 6px);background-size:26px 26px;background-position:13px 13px;border-radius:14px;padding:26px 14px;min-height:180px;display:flex;flex-wrap:wrap;gap:16px 20px;justify-content:center;align-items:flex-end}
.brick{background:none;border:0;padding:6px;border-radius:10px;cursor:pointer;line-height:0;transition:transform .12s ease}
.brick:hover{transform:translateY(-3px)}
.brick svg,.bk svg{display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.brick.right{animation:pop .45s ease}
.brick.wrong{animation:shake .35s ease}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.levels button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:left;line-height:1.3}
.levels button small{display:block;color:var(--muted);font-size:13px}
.levels button[aria-pressed="true"]{border-color:var(--accent)}
.say.hidden{color:transparent;background:repeating-linear-gradient(90deg,var(--line) 0 18px,transparent 18px 26px);border-radius:6px;min-width:220px}

/* Teacher */
.grades{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center}
.grades span{color:var(--muted);font-size:15px;margin-right:4px}
.grades button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:500}
.grades button[aria-pressed="true"]{border-color:var(--accent);background:var(--btn);color:var(--accent-ink)}
.tgrid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:840px){.tgrid{grid-template-columns:1.4fr 1fr}}
.col{display:grid;gap:16px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 10px;font-size:19px}
.card p,.card li{max-width:68ch}
.card p:last-child{margin-bottom:0}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{position:relative;padding:0 0 14px 44px;counter-increment:s}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:700}
.steps b{display:block}
.steps .min{color:var(--muted);font-size:14px;font-weight:400}
.words{display:flex;flex-wrap:wrap;gap:6px}
.wbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:15px;text-align:left}
.wbtn:hover{border-color:var(--accent)}
.sents{display:grid;gap:6px}
.focus{border-left:5px solid var(--accent);padding-left:14px}
.mission{background:var(--plate);border-radius:12px;padding:16px;font-size:19px;font-weight:500;margin-bottom:12px}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin-bottom:6px}
.gram td{padding:4px 12px 4px 0;vertical-align:top;font-size:15px}
.tablewrap{overflow-x:auto}
.intro{margin-bottom:20px}
.intro .cols{display:grid;gap:12px}
@media (min-width:720px){.intro .cols{grid-template-columns:repeat(3,1fr)}}
.intro .cols div{background:var(--soft);border-radius:12px;padding:14px;font-size:15px}
.intro .cols b{display:block;margin-bottom:4px;font-size:16px}
footer{margin-top:28px;color:var(--muted);font-size:14px}
#app.teacher{font-family:var(--serif)}
.theme,.panel,.card,.startbox,.helpbox,.canbox{box-shadow:var(--kort-skugga)}

/* ================= V2 ================= */
.quickbar{display:grid;grid-template-columns:1fr;gap:12px;margin:0 0 20px}
@media(min-width:700px){.quickbar{grid-template-columns:1.15fr 1fr 1fr}}
.startbox{background:linear-gradient(135deg,var(--surface),var(--soft));border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}
.startbox h2{margin-bottom:4px}
.path{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:15px}
@media(min-width:650px){.path{grid-template-columns:repeat(4,1fr)}}
.path button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.path button:hover{border-color:var(--accent)}
.path strong{display:block;font-size:15px}.path small{color:var(--muted);font-size:12px}
.helpbox{border:2px solid var(--accent);background:var(--surface);border-radius:18px;padding:18px;margin-bottom:20px}
.helpbox h3{margin:0 0 4px;font-size:22px}.helpbox p{margin:0 0 12px;color:var(--muted)}
.helpgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:650px){.helpgrid{grid-template-columns:repeat(2,1fr)}}
.helpitem{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;text-align:left}
.helpitem .sayphrase{font-weight:500}.helpitem button{flex:0 0 auto;border:0;background:var(--btn);color:var(--accent-ink);border-radius:999px;padding:6px 10px;cursor:pointer}
.sectionlabel{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:20px 0 8px}
.canbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.canbox h3{margin:0 0 8px}.canlist{display:grid;gap:7px}.canrow{display:flex;align-items:center;gap:9px;color:var(--ink);font-size:15px}.canrow input{width:18px;height:18px}

/* ================= V3: stadium och Bra att veta ================= */
.stages{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
@media(min-width:600px){.stages{grid-template-columns:repeat(3,1fr)}}
.stage{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;text-align:left;min-height:130px}
.stage:hover{border-color:var(--accent)}
.stage .ic{font-size:44px;line-height:1}
.stage .nm{font-weight:700;font-size:22px}
.stage small{color:var(--muted);font-size:14px}
.stagebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font-size:15px}
.stagebar b{color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:500;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.facts{display:grid;gap:10px}
.fact{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border-radius:12px;padding:14px 16px;font-size:18px}
.fact .btn{flex:0 0 auto;padding:8px 12px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Gemensam Norvay-list överst. Nollställer det appens egna stilar kan ge, så att listen ser likadan ut i alla appar. */
.norvay-bar, .norvay-bar * { margin: 0; text-transform: none; font-style: normal; }
.norvay-bar { box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 44px; padding: 8px 20px; background: #f5f3ec; border-bottom: 1px solid rgba(18,63,55,0.14); font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.2; }
.norvay-bar a { color: #123f37; text-decoration: none; }
.norvay-bar a:hover { text-decoration: underline; text-underline-offset: 3px; }
.norvay-bar a:focus-visible { outline: 3px solid #2f6b5a; outline-offset: 3px; border-radius: 6px; }
.norvay-bar-back { font-weight: 500; }
.norvay-bar-brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12px; letter-spacing: 0.2em; }
.norvay-bar-mark { width: 24px; height: 24px; border: 1.5px solid #123f37; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 13px; letter-spacing: 0; }
@media print { .norvay-bar { display: none !important; } }
/* Månknappen (samma som på Norvays startsida) och större tryckytor i listen */
.norvay-bar{padding-top:0;padding-bottom:0}
.norvay-bar a{display:inline-flex;align-items:center;min-height:44px}
.norvay-bar-right{display:inline-flex;align-items:center;gap:12px}
.n-theme{width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:1px solid rgba(18,63,55,.14);background:transparent;color:#123f37;display:inline-grid;place-items:center;cursor:pointer;padding:0;transition:border-color .3s ease,color .3s ease}
.n-theme:hover{border-color:#c9785f;color:#c9785f}
.n-theme:focus-visible{outline:3px solid #2f6b5a;outline-offset:3px}
.n-theme svg{width:18px;height:18px}
:root[data-theme="dark"] .norvay-bar{background:#0f2a24;border-bottom-color:rgba(236,231,218,.14)}
:root[data-theme="dark"] .norvay-bar a{color:#ece7da}
:root[data-theme="dark"] .norvay-bar-mark{border-color:#ece7da}
:root[data-theme="dark"] .n-theme{color:#ece7da;border-color:rgba(236,231,218,.14)}
:root[data-theme="dark"] .n-theme:hover{border-color:#e3a58f;color:#e3a58f}
:root[data-theme="dark"] .n-theme:focus-visible,:root[data-theme="dark"] .norvay-bar a:focus-visible{outline-color:#8fc2a8}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .norvay-bar{background:#0f2a24;border-bottom-color:rgba(236,231,218,.14)}

  const s=SIZES[size], W=s.studs*20, H=30; let studs='';
  for(let i=0;i<s.studs;i++) studs+=`<rect x="${i*20+4}" y="-6" width="12" height="8" rx="2" fill="${c.hex}" stroke="${c.dark}" stroke-width="1.5"/>`;

}

/* speech */
/* Väljer den bästa svenska rösten som finns på enheten, inte bara den första i listan:
   sv-SE först, sedan röster av hög kvalitet (Natural, Online, Neural, Enhanced, Premium),
   gärna en kvinnoröst. Vid lika poäng behålls enhetens egen ordning. */
const VOICE_QUALITY=/natural|online|neural|enhanced|förbättrad|premium|wavenet/i;
const VOICE_FEMALE=/sofie|hillevi|klara|alva|hedvig|astrid|ingrid|google svenska|\bfemale\b/i;
const VOICE_MALE=/bengt|mattias|oskar|\bmale\b/i;
function bestVoice(vs){
  let best=null, bestScore=-1;
  for(const v of vs){
    const lang=(v.lang||'').toLowerCase().replace('_','-');
    if(!lang.startsWith('sv')) continue;
    let s=0;
    if(lang==='sv-se') s+=4;
    if(VOICE_QUALITY.test(v.name)) s+=8;
    if(VOICE_FEMALE.test(v.name)) s+=3;
    if(VOICE_MALE.test(v.name)) s-=2;
    if(!v.localService) s+=1;
    if(s>bestScore){ best=v; bestScore=s; }
  }
  return best;
}
let svVoice=null;
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return;
  svVoice = bestVoice(vs);
  const n=$('voiceNotice');
  if(!svVoice){ n.hidden=false; n.textContent='Den här enheten har ingen svensk röst installerad, så uttalet kan bli fel. Lägg till svenska under enhetens inställningar för text till tal.'; } else n.hidden=true;
}

/* Lyssna och välj / Läs och välj */
function exQuiz(kind){
  const t=theme(st.theme), total=8, ws=wordsFor(t);
  const q={round:0, score:0, order:shuffle(ws).concat(shuffle(ws)).slice(0,total)};
  function next(){
    if(q.round>=total) return finish();
    q.target=q.order[q.round]; q.firstTry=true; q.locked=false;
    q.opts=shuffle([q.target].concat(sample(ws.filter(w=>w!==q.target),3)));
    const top = kind==='listen'
      ? `<button class="btn" id="qh">🔊 Lyssna</button><span class="say" style="font-size:18px;font-weight:500;color:var(--muted)">Vilken bild är det?</span>`
      : `<button class="btn ghost" data-say="${esc(q.target.w)}" aria-label="Lyssna på ordet">🔊</button><span class="say">${esc(q.target.w)}</span>`;
    $('panel').innerHTML = `<div class="qtop">${top}<span class="prog">${q.round+1} av ${total}</span></div>
      <div class="opts">${q.opts.map((w,i)=>`<button class="opt" data-i="${i}" aria-label="${esc(w.w)}">${pic(w)}</button>`).join('')}</div>
      <div class="status" id="qs" aria-live="polite"></div>`;
    if(kind==='listen'){ $('qh').onclick=()=>speak(q.target.w); speak(q.target.w); }
    $('panel').querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b));
  }
  function choose(b){
    if(q.locked) return;
    const w=q.opts[+b.dataset.i], s=$('qs');
    if(w===q.target){
      q.locked=true; if(q.firstTry){ q.score++; star(theme(st.theme)); }
      b.classList.add('right'); s.className='status ok'; s.textContent=`Rätt! ${q.target.w}.`;
      speak(`Rätt! ${q.target.w}.`); q.round++; timer=setTimeout(next,1700);
    } else {
      q.firstTry=false; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
      s.className='status no'; s.textContent=`Det där är ${w.w}. Försök igen.`;
      speak(`Det där är ${w.w}. Försök igen.`);
    }
  }
  function finish(){
    const msg = q.score>=7?'Superbra!':q.score>=5?'Bra jobbat!':'Bra kämpat! Öva lite till.';
    $('panel').innerHTML=`<div class="done"><div class="big">${q.score>=7?'🏆':q.score>=5?'🌟':'💪'}</div><p>${q.score} av ${total} rätt på första försöket. ${msg}</p><button class="btn" id="again">Spela igen</button></div>`;
    speak(`${q.score} av ${total} rätt. ${msg}`);
    $('again').onclick=()=>exQuiz(kind);
  }
  next();
}

/* Bygg meningen */
function exSentence(t){
  let list=shuffle(sentencesFor(t)), k=0, text, tokens, pool, ans;
  function load(){
    text=list[k%list.length]; tokens=text.split(' '); ans=[];
    const idx=tokens.map((_,i)=>i); do{pool=shuffle(idx);}while(tokens.length>1 && pool.join()===idx.join());
    draw();
  }
  function draw(){
    const chip=i=>`<button class="chip" data-i="${i}">${esc(tokens[i])}</button>`;
    $('panel').innerHTML=`<p class="lead" style="margin-bottom:12px">Lyssna. Tryck på orden i rätt ordning.</p>
      <div class="slots" id="slots" aria-label="Din mening">${ans.map(chip).join('')}</div>
      <div class="pool" id="pool">${pool.filter(i=>!ans.includes(i)).map(chip).join('')}</div>
      <div class="row"><button class="btn" id="sh">🔊 Lyssna</button><button class="btn ghost" id="sc">Börja om</button><button class="btn ghost" id="sn">Nästa mening</button></div>
      <div class="status" id="ss" aria-live="polite"></div>`;
    $('sh').onclick=()=>speak(text);
    $('sc').onclick=()=>{ans=[];draw();};
    $('sn').onclick=()=>{k++;load();speak(text);};
    $('pool').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const i=+b.dataset.i; ans.push(i); speak(tokens[i].replace(/[.,?!]/g,'')); draw();});
    $('slots').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const i=+b.dataset.i; ans=ans.filter(x=>x!==i); draw();});
    if(ans.length===tokens.length){
      const s=$('ss');
      if(ans.map(i=>tokens[i]).join(' ')===text){
        $('slots').classList.add('ok'); s.className='status ok'; s.textContent='Rätt! Läs meningen högt.'; speak(text); star(t);
      } else { s.className='status no'; s.textContent='Inte riktigt. Tryck på ett ord för att flytta tillbaka det.'; }
    }
  }
  load();
}

function descInd(c,size,med){ const w=size==='m'?(med?'mellanstor':''):SIZES[size].ind; return 'en '+(w?w+' ':'')+c.ind+' kloss'; }
function descDef(c,size){ const w=SIZES[size].def; return 'den '+(w?w+' ':'')+c.def+' klossen'; }
const lego={level:1};
function exLego(t){
  $('panel').innerHTML=`<p class="lead" style="margin-bottom:12px">Lyssna. Tryck på rätt kloss.</p>

    </div>

    <div class="plate" id="lp"></div>
    <div class="row"><label class="tools" style="margin:0"><input type="checkbox" id="lt" ${lego.hide?'':'checked'}> Visa texten</label><button class="btn ghost" id="ln">Ny uppgift</button></div>

  document.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{lego.level=+b.dataset.l; document.querySelectorAll('.levels button').forEach(x=>x.setAttribute('aria-pressed',x===b)); round(true);});
  $('lh').onclick=()=>speak(lego.prompt);
  $('ln').onclick=()=>round(true);
  $('lt').onchange=()=>{lego.hide=!$('lt').checked; showPrompt();};
  function showPrompt(){ const s=$('lsay'); s.textContent=lego.prompt; s.classList.toggle('hidden',!!lego.hide); }
  function round(talk){
    lego.locked=false; $('ls').textContent=''; $('ls').className='status';
    const L=lego.level;
    if(L===1){ lego.items=sample(COLORS,4).map(c=>({c,size:'m'})); lego.target=pick(lego.items); lego.prompt=`Tryck på ${descDef(lego.target.c,'m')}.`; }
    else if(L===2){
      const tc=pick(COLORS), ts=pick(['s','l']), other=ts==='s'?'l':'s';
      const items=[{c:tc,size:ts},{c:tc,size:other}], key=o=>o.c.ind+o.size, used=new Set(items.map(key));
      sample(COLORS.filter(c=>c!==tc),2).forEach(c=>{const o={c,size:ts}; items.push(o); used.add(key(o));});
      while(items.length<6){ const o={c:pick(COLORS),size:pick(['s','l'])}; if(!used.has(key(o))){items.push(o);used.add(key(o));} }
      lego.target=items[0]; lego.items=shuffle(items); lego.prompt=`Tryck på ${descDef(tc,ts)}.`;
    } else {
      const tc=pick(COLORS), sup=pick(['s','l']), items=['s','m','l'].map(size=>({c:tc,size}));
      lego.target=items.find(o=>o.size===sup);
      sample(COLORS.filter(c=>c!==tc),3).forEach(c=>items.push({c,size:pick(['s','m','l'])}));
      lego.items=shuffle(items); lego.prompt=`Tryck på den ${SIZES[sup].sup} ${tc.def} klossen.`;
    }
    $('lp').innerHTML=lego.items.map((o,i)=>`<button class="brick" data-i="${i}" aria-label="${descInd(o.c,o.size,L===3)}">${brickSVG(o.c,o.size)}</button>`).join('');
    $('lp').querySelectorAll('.brick').forEach(b=>b.onclick=()=>{
      if(lego.locked) return;
      const o=lego.items[+b.dataset.i], s=$('ls');
      if(o===lego.target){
        lego.locked=true; b.classList.add('right'); s.className='status ok'; s.textContent='Rätt! Bra jobbat!';
        speak('Rätt! Bra jobbat!'); star(t); timer=setTimeout(()=>round(true),2300);
      } else {
        b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
        const d=descInd(o.c,o.size,L===3); s.className='status no'; s.textContent=`Det är ${d}. Försök igen.`; speak(`Det är ${d}. Försök igen.`);
      }
    });
    showPrompt(); if(talk) speak(lego.prompt);
  }
  round(false);
}

        <div class="card"><h3>Lektionsupplägg, cirka 40 minuter</h3><ol class="steps">${p.steps.map(s=>`<li><b>${s[0]} <span class="min">${s[1]}</span></b>${s[2]}</li>`).join('')}</ol></div>
        <div class="card"><h3>Anpassa för ${GRADE_NAMES[st.grade].toLowerCase()}</h3><p class="focus">${p.grades[st.grade]}</p></div>
        <div class="card"><h3>Bra att veta för ${GRADE_NAMES[st.grade].toLowerCase()}</h3><p style="margin-top:0;font-size:15px;color:var(--muted)">Samma fakta som eleverna ser under Bra att veta. Tryck för att höra.</p>
          <div class="sents">${facts.map(f=>`<button class="wbtn" data-say="${esc(f)}">🔊 ${esc(f)}</button>`).join('')}</div></div>
        <div class="card"><h3>Fler aktiviteter</h3><ul class="plain">${p.ideas.map(i=>`<li>${i}</li>`).join('')}</ul></div>
        <div class="card"><h3>Modersmålsstöd och hänsyn</h3><p>${p.mother}</p></div>
      </div>
      <div class="col">
        ${mission}
        <div class="card"><h3>Ordlista</h3><p style="margin-top:0;font-size:15px;color:var(--muted)">Tryck för att höra ordet.</p>
          <div class="words">${wordsFor(t).map(w=>`<button class="wbtn" data-say="${esc(w.w)}">${w.e} ${esc(w.w)}</button>`).join('')}</div></div>
        <div class="card"><h3>Fraser att öva</h3><div class="sents">${sentencesFor(t).map(s=>`<button class="wbtn" data-say="${esc(s)}">🔊 ${esc(s)}</button>`).join('')}</div></div>
      </div>
    </div>`;
  $('bk').onclick=()=>go({theme:null});
  $('toS').onclick=()=>{ setGrade(st.grade); go({mode:'s', ex:'cards', picking:false}); };
  bindGrades();
  if(t.lego){
    let txt=''; const nm=()=>{txt=pick(MISSIONS[st.grade])(); $('mi').textContent=txt;};
    $('mh').onclick=()=>speak(txt); $('mn').onclick=nm; nm();
  }
}

render();
</script>
<script>
/* ---------- Nattläge: månknappen (samma utseende som på Norvay) ---------- */
(function(){
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  var btn = document.getElementById('themeBtn');
  var enhet = window.matchMedia('(prefers-color-scheme: dark)');
  /* Sparar valet i kakan "norvay-tema" för alla Norvays verktyg (ett år). Bara ordet light eller dark. */
  function sparaTema(t){
    var doman = /(^|\.)norvayapp\.se$/.test(location.hostname) ? '; domain=.norvayapp.se' : '';
    var saker = location.protocol === 'https:' ? '; secure' : '';
    document.cookie = 'norvay-tema=' + t + '; path=/; max-age=31536000; samesite=lax' + saker + doman;
  }
  function arMorkt(){
    var t = document.documentElement.getAttribute('data-theme');
    return t ? t === 'dark' : enhet.matches;
  }
  function mala(){
    var dark = arMorkt();
    btn.innerHTML = dark ? SUN : MOON;
    btn.setAttribute('aria-label', dark ? 'Byt till ljust läge' : 'Byt till mörkt läge');
    btn.setAttribute('aria-pressed', String(dark));
  }
  btn.addEventListener('click', function(){
    var next = arMorkt() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    sparaTema(next);
    mala();
  });
  if (enhet.addEventListener) enhet.addEventListener('change', mala);
  mala();
})();
</script>
</body>
</html>
